<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Via Painéis</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="p-6 bg-gray-50" data-modulo="admin">
  <header id="user-header" class="hidden">
    <div class="container">
      <span id="user-email"></span>
      <button id="logout-button">Sair</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto">
    <a href="index.html" class="text-blue-600 underline mb-4 inline-block">← Voltar</a>
    <h1 class="text-2xl font-bold text-indigo-700 mb-6">Painel administrativo</h1>

    <section class="bg-white p-4 rounded shadow mb-6">
      <h2 class="text-lg font-semibold mb-4">Criar usuário</h2>
      <form id="admin-create-user-form" class="space-y-4">
        <div>
          <label for="admin-user-name" class="block text-sm font-medium text-gray-700">Nome</label>
          <input type="text" id="admin-user-name" name="full_name" class="input mt-1" required />
        </div>
        <div>
          <label for="admin-user-email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="admin-user-email" name="email" class="input mt-1" required />
        </div>
        <div>
          <label for="admin-user-role" class="block text-sm font-medium text-gray-700">Perfil</label>
          <select id="admin-user-role" name="role" class="input mt-1">
            <option value="user">Usuário</option>
            <option value="superadmin">Superadmin</option>
          </select>
        </div>
        <button type="submit" class="btn-indigo">Enviar convite</button>
      </form>
      <p id="admin-create-user-status" class="text-sm mt-4"></p>
    </section>

    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-semibold mb-4">Usuários</h2>
      <div id="admin-users-list" class="space-y-3">
        <p>Carregando usuários...</p>
      </div>
    </section>
  </main>
</body>
</html>
