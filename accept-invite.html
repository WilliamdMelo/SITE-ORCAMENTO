<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aceitar Convite - Via Painéis</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen" data-modulo="accept-invite">
  <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-indigo-700 mb-3 text-center">Definir senha</h1>
    <p id="accept-invite-message" class="text-sm text-gray-600 text-center mb-6">
      Validando convite...
    </p>
    <form id="accept-invite-form" class="space-y-4 hidden">
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Nova senha</label>
        <input type="password" id="password" name="password" class="input mt-1" minlength="6" required />
      </div>
      <div>
        <label for="password-confirmation" class="block text-sm font-medium text-gray-700">Confirmar senha</label>
        <input type="password" id="password-confirmation" name="password_confirmation" class="input mt-1" minlength="6" required />
      </div>
      <button type="submit" class="btn-indigo w-full">Salvar senha</button>
    </form>
    <p class="text-xs text-center mt-4">
      <a href="./login.html" class="text-indigo-600 hover:underline">Voltar para o login</a>
    </p>
  </div>
</body>
</html>
